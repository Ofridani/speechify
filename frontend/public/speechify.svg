<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-labelledby="t2 d2">
  <title id="t2">Speechify — rounded logo</title>
  <desc id="d2">Rounded-corner microphone with softer three-bar sentiment indicator.</desc>

  <!-- rounded capsule with soft shadow -->
  <g>
    <rect x="14" y="6" width="36" height="36" rx="10" ry="10" fill="#0F172A"/>
    <rect x="18" y="10" width="28" height="28" rx="8" ry="8" fill="#fff"/>
  </g>

  <!-- bars (colours chosen for contrast on white) -->
  <rect x="24" y="20" width="4" height="12" rx="2" fill="#E24A4A"/>
  <rect x="30.5" y="16" width="4" height="16" rx="2" fill="#F3C13A"/>
  <rect x="37" y="22" width="4" height="10" rx="2" fill="#4A90E2"/>

  <!-- stem and base -->
  <rect x="29" y="40" width="6" height="5" rx="2" ry="2" fill="#0F172A"/>
  <rect x="23" y="46" width="18" height="4" rx="2" ry="2" fill="#0F172A"/>
</svg>